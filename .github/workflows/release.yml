name: Release

# Fork build: unsigned, no notarization. Suitable for personal use only —
# users who install this artifact must clear quarantine manually
# (`xattr -cr "/Applications/Claude Usage.app"`) and Sparkle auto-update
# does not work because Info.plist still points at upstream's appcast.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release (Unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version
          echo "macOS: $(sw_vers -productVersion)"
          echo "Tag: ${{ github.ref_name }}"

      - name: Build Release (Unsigned)
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "✅ Build completed"

      - name: Create Release Artifact
        run: |
          mkdir -p release
          cp -pR "build/Build/Products/Release/Claude Usage.app" release/

          cd release
          ditto -c -k --keepParent "Claude Usage.app" "Claude-Usage.zip"
          shasum -a 256 "Claude-Usage.zip" > "Claude-Usage.zip.sha256"

          echo ""
          echo "SHA256:"
          cat "Claude-Usage.zip.sha256"

      - name: Extract Release Notes from CHANGELOG
        id: changelog_notes
        continue-on-error: true
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Extract the section for this version from CHANGELOG.md
          awk "/## \[$VERSION\]/{flag=1; next} /^---$|^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

          sed -i.bak '/^$/d' release-notes.md 2>/dev/null || sed -i '' -e '/^$/d' release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "changelog_extracted=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Prepend a clear unsigned-build banner.
          {
            echo "> ⚠️ **Unsigned fork build.** Run \`xattr -cr \"/Applications/Claude Usage.app\"\` after copying it into Applications. Sparkle auto-update does not work for this artifact."
            echo ""
            cat release-notes.md
          } > release-notes.full.md
          mv release-notes.full.md release-notes.md

          echo "changelog_extracted=true" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          body_path: ${{ steps.changelog_notes.outputs.changelog_extracted == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog_notes.outputs.changelog_extracted != 'true' }}
          files: |
            release/Claude-Usage.zip
            release/Claude-Usage.zip.sha256
        env:
          # Use the default GITHUB_TOKEN — RELEASE_TOKEN (PAT) is only needed
          # to chain into appcast/homebrew workflows, which this fork build
          # intentionally does not run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "🎉 Release ${{ github.ref_name }} created (unsigned fork build)"
          echo ""
          echo "Install: xattr -cr \"/Applications/Claude Usage.app\" after copying."
